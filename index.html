<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Актовый зал</title>
<script>
  // ▼▼▼ Вставьте адрес веб-приложения Apps Script (заканчивается на /exec) ▼▼▼
  window.APP_CONFIG = {
    API_URL: 'https://script.google.com/macros/s/AKfycby9qUp-Ka2122-u6Jo19vlxlyBf7Fc6jt9b2sa0uc6Ebn4CkZARYCNtWZDQ1LrAfRpwrw/exec',
  };
</script>
<style>
:root{
  --bg:#ffffff; --bg2:#f1f2f6; --card:#ffffff; --text:#14171c; --hint:#7c838d; --line:rgba(20,23,28,.09);
  --accent:#2f6fed; --accent-text:#ffffff; --accent-soft:rgba(47,111,237,.12);
  --ok:#1a8f4c; --ok-soft:rgba(26,143,76,.12);
  --warn:#c77700; --warn-soft:rgba(230,150,0,.15);
  --danger:#e0484d; --danger-soft:rgba(224,72,77,.12);
  --shadow:0 8px 28px rgba(15,20,30,.16);
  --r:14px;
}
html.dark{
  --bg:#17181c; --bg2:#0e0f12; --card:#1d1f24; --text:#eef0f3; --hint:#8b929c; --line:rgba(255,255,255,.09);
  --accent:#5b8cff; --accent-soft:rgba(91,140,255,.16);
  --ok:#3ecf7c; --ok-soft:rgba(62,207,124,.14);
  --warn:#f0a531; --warn-soft:rgba(240,165,49,.16);
  --danger:#ff6b6f; --danger-soft:rgba(255,107,111,.15);
  --shadow:0 8px 28px rgba(0,0,0,.5);
}
html.tg{
  --bg:var(--tg-theme-bg-color); --bg2:var(--tg-theme-secondary-bg-color,var(--tg-theme-bg-color));
  --card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color)); --text:var(--tg-theme-text-color);
  --hint:var(--tg-theme-hint-color); --accent:var(--tg-theme-button-color); --accent-text:var(--tg-theme-button-text-color);
  --danger:var(--tg-theme-destructive-text-color,#e0484d);
}
@supports (color:color-mix(in srgb,red 10%,transparent)){
  html.tg{ --accent-soft:color-mix(in srgb,var(--accent) 14%,transparent); --danger-soft:color-mix(in srgb,var(--danger) 13%,transparent); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg2);color:var(--text)}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none}
body.with-tabs{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
body.with-fab{padding-bottom:calc(138px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:18px;height:18px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.hint{color:var(--hint)}
.small{font-size:13px}
.mt{margin-top:12px}.mt2{margin-top:20px}

/* шапка */
header.top{position:sticky;top:0;z-index:5;background:var(--bg2)}
.hdr{display:flex;align-items:center;gap:8px;padding:12px 14px 10px}
.hdr .ttl{flex:1;min-width:0}
.brand{font-weight:700;font-size:21px;letter-spacing:-.02em;line-height:1.15}
.sub{color:var(--hint);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--hint)}
.icon-btn:active{background:var(--line)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;display:grid;place-items:center;flex:none}

/* карточки и списки */
.card{background:var(--card);border-radius:var(--r);padding:14px}
.sec-t{font-size:13px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--hint);margin:20px 4px 8px}
.list>*+*{margin-top:8px}

/* неделя */
.weeknav{display:flex;align-items:center;gap:6px;margin:4px 0 10px}
.weeknav .mlabel{flex:1;font-weight:600;font-size:16px;padding-left:4px}
.pill{height:32px;padding:0 12px;border-radius:999px;background:var(--card);font-size:13px;font-weight:600;color:var(--accent);display:inline-flex;align-items:center}
.round{width:32px;height:32px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{display:flex;flex-direction:column;align-items:center;padding:7px 0 6px;border-radius:12px;background:var(--card);min-width:0}
.day .wd{font-size:11px;color:var(--hint);text-transform:uppercase;letter-spacing:.02em}
.day .num{font-size:17px;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}
.day .dots{height:5px;display:flex;gap:3px;margin-top:4px}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day .dot.p{background:var(--warn)}
.day.past .num{color:var(--hint)}
.day.today:not(.sel){box-shadow:inset 0 0 0 1.5px var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-text)}
.day.sel .wd,.day.sel .num{color:inherit}.day.sel .wd{opacity:.85}
.day.sel .dot,.day.sel .dot.p{background:var(--accent-text)}
.day.off{opacity:.3;pointer-events:none}

/* день */
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:20px 4px 10px}
.dayhead h2{margin:0;font-size:19px;letter-spacing:-.01em}
.track-wrap{padding:14px 14px 10px}
.track{position:relative;height:30px;background:var(--bg2);border-radius:8px;overflow:hidden}
.blk{position:absolute;top:3px;bottom:3px;background:var(--accent);border-radius:5px;min-width:3px}
.blk.p{background:repeating-linear-gradient(135deg,var(--warn) 0 5px,transparent 5px 9px);box-shadow:inset 0 0 0 1.5px var(--warn)}
.blk.sel{background:transparent;box-shadow:inset 0 0 0 2px var(--text);z-index:2}
.blk.sel.bad{box-shadow:inset 0 0 0 2px var(--danger);background:var(--danger-soft)}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:3}
.ticks{position:relative;height:16px;margin-top:5px;font-size:11px;color:var(--hint);font-variant-numeric:tabular-nums}
.ticks span{position:absolute}
.legend{display:flex;gap:14px;font-size:12px;color:var(--hint);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);margin-right:5px;vertical-align:-1px}
.legend i.p{background:repeating-linear-gradient(135deg,var(--warn) 0 3px,transparent 3px 5px);box-shadow:inset 0 0 0 1px var(--warn)}
.free{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.free .lbl{font-size:13px;color:var(--hint);margin-right:2px}
.slot{height:30px;padding:0 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}

/* бронь */
.bk{display:flex;gap:12px;width:100%;padding:12px 14px;background:var(--card);border-radius:var(--r);align-items:stretch}
.bk:active{opacity:.75}
.bk .time{min-width:46px;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;line-height:1.25}
.bk .time small{display:block;color:var(--hint);font-weight:500;font-size:13px}
.bk .bar{width:3px;border-radius:2px;background:var(--accent);flex:none}
.bk.p .bar{background:var(--warn)}
.bk.x .bar{background:var(--hint);opacity:.5}
.bk.x .t{text-decoration:line-through;color:var(--hint)}
.bk .body{flex:1;min-width:0}
.bk .t{font-weight:600;overflow-wrap:anywhere}
.bk .m{color:var(--hint);font-size:13px;margin-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;line-height:18px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.mut{background:var(--bg2);color:var(--hint)}
.empty{text-align:center;padding:26px 16px;color:var(--hint)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.actions{display:flex;gap:8px;margin-top:12px}
.warnbox{margin-top:8px;font-size:13px;padding:8px 10px;border-radius:10px;background:var(--danger-soft);color:var(--danger)}
.warnbox.w{background:var(--warn-soft);color:var(--warn)}

/* кнопки */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:12px;background:var(--accent);color:var(--accent-text);font-weight:600;font-size:16px;text-align:center}
.btn:active{filter:brightness(.92)}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{height:40px;font-size:15px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.fab{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));padding:8px 14px 10px;z-index:9;pointer-events:none}
.fab .btn{pointer-events:auto;max-width:532px;margin:0 auto;box-shadow:var(--shadow)}

/* вкладки */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:5px 8px calc(5px + env(safe-area-inset-bottom))}
nav.tabs .in{display:flex;max-width:560px;margin:0 auto}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--hint);padding:5px 0 3px;position:relative;text-align:center}
nav.tabs button.on{color:var(--accent)}
.badge{position:absolute;top:0;left:calc(50% + 5px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;gap:3px;margin:4px 0 12px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:14px;font-weight:600;color:var(--hint);text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.seg .n{font-size:12px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;line-height:18px;padding:0 5px}

/* формы */
.field{margin-bottom:14px}
.field>label{display:block;font-size:13px;font-weight:500;color:var(--hint);margin:0 4px 6px}
.input{display:block;width:100%;height:46px;border-radius:12px;border:1.5px solid transparent;background:var(--bg2);color:var(--text);padding:0 14px;font:inherit;font-size:16px;outline:none;-webkit-appearance:none;appearance:none;min-width:0}
textarea.input{height:auto;min-height:72px;padding:11px 14px;resize:vertical;line-height:1.35}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--hint);opacity:.8}
input[type=date].input,input[type=time].input{line-height:46px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{height:36px;padding:0 13px;border-radius:999px;background:var(--bg2);font-size:14px;font-weight:500}
.opts button.on{background:var(--accent);color:var(--accent-text)}
.opts .sep{width:100%;height:0}
#f-spec button.own.on{background:var(--ok);color:#fff}
.pp-sel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pp-sel:empty{display:none}
.pp-chip{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 6px 0 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:600}
.pp-chip button{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:inherit}
.pp-res{display:flex;flex-direction:column;margin-top:6px;border-radius:12px;overflow:hidden}
.pp-res:empty{display:none}
.pp-res button{display:flex;justify-content:space-between;gap:8px;text-align:left;padding:10px 12px;background:var(--bg2);border-top:1px solid var(--line);font-size:15px}
.pp-res button:first-child{border-top:0}
.pp-res small{color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spec-hint{margin-top:8px}
.cl-box{background:var(--bg2);border-radius:14px;padding:12px;margin:-4px 0 14px}
.cl-box .row3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.cl-box .input{background:var(--card)}
.cl-st{font-size:13px;margin-top:8px}
.cl-st.bad{color:var(--danger)}.cl-st.ok{color:var(--ok)}
.bk.anon .t{color:var(--hint)}
.spec-hint .btn{margin-top:8px}
.dur{display:flex;gap:6px;margin-top:8px}
.dur button{flex:1;height:32px;border-radius:9px;background:var(--bg2);font-size:13px;font-weight:600;color:var(--hint);text-align:center}
.status-line{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:10px 12px;border-radius:12px;margin-bottom:14px}
.status-line.ok{background:var(--ok-soft);color:var(--ok)}
.status-line.warn{background:var(--warn-soft);color:var(--warn)}
.status-line.bad{background:var(--danger-soft);color:var(--danger)}
.status-line.mut{background:var(--bg2);color:var(--hint)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:4px 2px 14px}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent)}

/* экраны-заглушки */
.hero{text-align:center;padding:34px 10px 20px}
.hero .ico{width:68px;height:68px;border-radius:20px;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;margin:0 auto 16px}
.hero .ico svg{width:34px;height:34px}
.hero .ico.soft{background:var(--accent-soft);color:var(--accent)}
.hero .ico.warn{background:var(--warn-soft);color:var(--warn)}
.hero .ico.bad{background:var(--danger-soft);color:var(--danger)}
.hero h1{font-size:23px;margin:0 0 6px;letter-spacing:-.02em}
.hero p{color:var(--hint);margin:0 auto;max-width:340px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--hint)}.kv dd{margin:0;overflow-wrap:anywhere}
.linkish{display:block;width:100%;text-align:center;color:var(--accent);font-weight:500;padding:14px 0}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.center{min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;color:var(--hint)}

/* люди */
.person{display:flex;gap:12px;align-items:center;width:100%;padding:11px 14px;background:var(--card);border-radius:var(--r)}
.person .avatar{width:40px;height:40px}
.person .body{flex:1;min-width:0}
.person .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .m{font-size:13px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:4px;flex:none}
.tag{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--bg2);color:var(--hint)}
.tag.on{background:var(--accent-soft);color:var(--accent)}

/* шторка */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:20;opacity:0;transition:opacity .22s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:6px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet.show{transform:none}
.sheet .inner{max-width:560px;margin:0 auto}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}
.sheet .lead{color:var(--hint);margin:0 0 16px;font-size:14px}
.sheet .sheet-actions>*+*{margin-top:8px}
.dialog-wrap{position:fixed;inset:0;z-index:31;display:flex;align-items:center;justify-content:center;padding:20px;pointer-events:none}
.dialog{pointer-events:auto;background:var(--card);border-radius:18px;padding:20px 18px 12px;width:100%;max-width:380px;box-shadow:var(--shadow);transform:scale(.95);opacity:0;transition:transform .18s,opacity .18s}
.dialog.show{transform:none;opacity:1}
.dialog h3{margin:0 0 6px;font-size:18px}
.dialog .lead{color:var(--hint);margin:0 0 14px;font-size:14px}
.dialog .sheet-actions>*+*{margin-top:4px}
.code{font-size:40px;font-weight:700;letter-spacing:.18em;text-align:center;font-variant-numeric:tabular-nums;padding:14px 0 6px}

.mbtn{flex:1;display:flex;align-items:center;gap:6px;font-weight:600;font-size:16px;padding:6px 6px;border-radius:10px;min-width:0;text-align:left}
.mbtn svg{color:var(--hint)}
.mbtn:active{background:var(--line)}
.cal-head{display:flex;align-items:center;gap:6px;margin:2px 0 12px}
.cal-head .t{flex:1;font-size:19px;font-weight:700;letter-spacing:-.01em}
.cal-head .round{background:var(--bg2)}
.cal-head .pill{background:var(--bg2)}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px;color:var(--hint);text-align:center;margin-bottom:6px;text-transform:uppercase;letter-spacing:.02em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-d{height:48px;border-radius:12px;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:16px;text-align:center}
.cal-d .dots{display:flex;gap:3px;height:5px;margin-top:3px}
.cal-d .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal-d .dot.p{background:var(--warn)}
.cal-d.past{color:var(--hint)}
.cal-d.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-d.sel{background:var(--accent);color:var(--accent-text)}
.cal-d.sel .dot,.cal-d.sel .dot.p{background:var(--accent-text)}
.cal-d.off{opacity:.3;pointer-events:none}
.cal-d.blank{background:none;pointer-events:none}
.rep{background:var(--bg2);border-radius:14px;padding:12px 12px 6px;margin:-4px 0 14px}
.rep .opts button{background:var(--card)}
.rep .opts button.on{background:var(--accent)}
.rep .input{background:var(--card)}
.occ-row{display:grid;grid-template-columns:24px 1fr 76px 76px;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.occ-row:first-child{border-top:0}
.occ-row .d{font-size:14px;font-weight:600;line-height:1.25;min-width:0}
.occ-row .d small{display:block;font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.occ-row .d small.bad{color:var(--danger)}.occ-row .d small.warn{color:var(--warn)}.occ-row .d small.ok{color:var(--ok)}
.occ-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin:0}
.occ-row.off .d,.occ-row.off input[type=time]{opacity:.5}
.input.sm{height:38px;font-size:15px;padding:0 4px;border-radius:10px;line-height:38px;text-align:center}
.input.sm::-webkit-calendar-picker-indicator{display:none}
.input.sm::-webkit-datetime-edit{padding:0}
#f-wd{gap:5px}
#f-wd button{width:42px;padding:0;height:36px}
.occ-sum{font-size:13px;color:var(--hint);margin:2px 2px 6px}
/* праздники и времена года */
.fest{display:inline-block;margin-left:6px;font-size:18px;vertical-align:1px;cursor:default}
.brand{cursor:default;user-select:none;-webkit-user-select:none}
.fest-banner{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r);padding:10px 8px 10px 14px;margin:2px 0 10px;font-weight:600}
.fest-banner .e{font-size:22px}
.fest-banner .t{flex:1}
.fest-banner button{width:30px;height:30px;border-radius:50%;color:var(--hint);display:grid;place-items:center}
.fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.fx span{position:absolute;top:-40px;color:#8ec5ff;text-shadow:0 0 6px rgba(120,180,255,.5);animation:fxfall linear forwards;opacity:.9;will-change:transform}
@keyframes fxfall{to{transform:translate3d(var(--dx,0),112vh,0) rotate(var(--rot,360deg))}}
@media (prefers-reduced-motion:reduce){.fx{display:none}}
/* листание дней */
main.swipe-l{animation:swl .22s ease-out}main.swipe-r{animation:swr .22s ease-out}
@keyframes swl{from{transform:translateX(28px);opacity:.4}to{transform:none;opacity:1}}
@keyframes swr{from{transform:translateX(-28px);opacity:.4}to{transform:none;opacity:1}}
.swipe-hint{text-align:center;font-size:12px;color:var(--hint);margin:14px 0 0}
/* боковой календарь — только на широком экране */
.side{display:none}
@media (min-width:640px){
  .wrap{max-width:720px}
  nav.tabs .in{max-width:720px}
}
@media (min-width:900px){
  .wrap{max-width:1120px;padding:0 24px}
  nav.tabs .in{max-width:1120px}
  .hdr.wrap{padding-left:24px!important;padding-right:24px!important}
  .sched{display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px;align-items:start}
  .side{display:block;position:sticky;top:74px;background:var(--card);border-radius:18px;padding:16px}
  .side .cal-d{height:42px}
  .weeknav .mbtn{pointer-events:none}.weeknav .mbtn svg:last-child{display:none}
  .swipe-hint{display:none}
  .list-wide{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .list-wide>*{margin:0!important}
  .sheet{left:50%;right:auto;top:50%;bottom:auto;width:min(620px,92vw);max-height:88vh;border-radius:20px;padding:18px 22px 20px;transform:translate(-50%,-46%) scale(.98);opacity:0;transition:transform .2s,opacity .2s}
  .sheet.show{transform:translate(-50%,-50%);opacity:1}
  .grab{display:none}
  .fab{left:auto;right:max(24px,calc((100vw - 1120px)/2 + 24px));width:360px}
}
/* телефон горизонтально */
@media (orientation:landscape) and (max-height:520px){
  .hdr{padding:6px 14px 4px}.brand{font-size:18px}.sub{display:none}
  .day{padding:4px 0}
  nav.tabs button{padding-top:4px;padding-bottom:4px}
  body.with-tabs{padding-bottom:calc(56px + env(safe-area-inset-bottom))}
  .sheet{max-height:96vh}
  .fab{bottom:calc(52px + env(safe-area-inset-bottom));left:auto;right:14px;width:auto;padding:0}
  .fab .btn{width:auto;padding:0 20px;height:44px}
  body.with-fab{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
}
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translate(-50%,-14px);opacity:0;transition:opacity .2s,transform .2s;z-index:40;background:rgba(22,24,28,.94);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 28px);width:max-content;text-align:center;pointer-events:none;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.error{background:#c93c41}
#progress{position:fixed;top:0;left:0;right:0;height:2px;z-index:50;overflow:hidden;opacity:0;transition:opacity .2s;pointer-events:none}
#progress.on{opacity:1}
#progress::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:var(--accent);animation:prog 1s infinite ease-in-out}
@keyframes prog{0%{left:-40%}100%{left:100%}}
</style>
</head>
<body>
<div id="progress"></div>
<div id="app"></div>
<div id="sheets"></div>
<div id="toast"></div>
<script>
(function () {
'use strict';

/* ---------------- утилиты ---------------- */
var API_URL = (window.APP_CONFIG && window.APP_CONFIG.API_URL) || '';
var $ = function (s, el) { return (el || document).querySelector(s); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var WD = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
var WDF = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
var MG = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
var MN = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
function p2(n) { return (n < 10 ? '0' : '') + n; }
function utc(iso) { var a = iso.split('-'); return new Date(Date.UTC(+a[0], a[1] - 1, +a[2])); }
function addDays(iso, n) { return new Date(utc(iso).getTime() + n * 864e5).toISOString().slice(0, 10); }
function wday(iso) { return utc(iso).getUTCDay(); }
function monday(iso) { return addDays(iso, -((wday(iso) + 6) % 7)); }
function human(iso) { return +iso.slice(8) + ' ' + MG[+iso.slice(5, 7) - 1]; }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function humanFull(iso) { return cap(WDF[wday(iso)]) + ', ' + human(iso); }
function toMin(t) { var m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; }
function fmt(m) { return p2(Math.floor(m / 60)) + ':' + p2(m % 60); }
function initials(fio) { var p = String(fio || '').trim().split(/\s+/); return ((p[0] || '').charAt(0) + (p[1] || '').charAt(0)).toUpperCase() || '?'; }
function plural(n, a, b, c) { var m = n % 10, h = n % 100; return n + ' ' + (m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c); }

var I = {
  logo: '<svg class="i" viewBox="0 0 24 24"><path d="M3 3.5h18"/><path d="M3 3.5v3c1.5 1.3 3 1.3 4.5 0 1.5 1.3 3 1.3 4.5 0 1.5 1.3 3 1.3 4.5 0 1.5 1.3 3 1.3 4.5 0v-3"/><path d="M4 7.5c0 5 .8 9 2.8 12.5H4z"/><path d="M20 7.5c0 5-.8 9-2.8 12.5H20z"/><path d="M2.5 20.5h19"/></svg>',
  cal: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  list: '<svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>',
  shield: '<svg class="i" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  refresh: '<svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.4 5.7"/><path d="M20 4v7h-7"/></svg>',
  left: '<svg class="i s" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
  right: '<svg class="i s" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  check: '<svg class="i s" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>',
  x: '<svg class="i s" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  clock: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  alert: '<svg class="i" viewBox="0 0 24 24"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.01"/></svg>',
  ban: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/></svg>',
  link: '<svg class="i s" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  down: '<svg class="i s" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  edit: '<svg class="i s" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  repeat: '<svg class="i s" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>',
  chat: '<svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
};

/* ---------------- платформа (Telegram / MAX) ---------------- */
var P = { name: null, initData: '', tg: null, max: null };

function parseHash() {
  var out = {};
  (location.hash || '').replace(/^#/, '').split('&').forEach(function (kv) {
    if (!kv) return;
    var i = kv.indexOf('='), k = i < 0 ? kv : kv.slice(0, i), v = i < 0 ? '' : kv.slice(i + 1);
    try { out[decodeURIComponent(k)] = decodeURIComponent(v); } catch (e) { out[k] = v; }
  });
  return out;
}
function isDark(hex) {
  var m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  var n = parseInt(m[1], 16);
  return (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) < 128;
}
function applyTgTheme(tp) {
  if (!tp || !tp.bg_color) return;
  var r = document.documentElement;
  Object.keys(tp).forEach(function (k) { r.style.setProperty('--tg-theme-' + k.replace(/_/g, '-'), tp[k]); });
  r.classList.add('tg');
  r.classList.toggle('dark', isDark(tp.bg_color));
}
function loadScript(src, ms) {
  return new Promise(function (res) {
    var s = document.createElement('script'), done = false;
    var fin = function (ok) { if (!done) { done = true; res(ok); } };
    s.src = src; s.async = true;
    s.onload = function () { fin(true); }; s.onerror = function () { fin(false); };
    setTimeout(function () { fin(false); }, ms);
    document.head.appendChild(s);
  });
}
function setupTg(tg) {
  P.tg = tg;
  if (tg.initData) P.initData = tg.initData;
  try { tg.ready(); tg.expand(); } catch (e) {}
  try { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } catch (e) {}
  try { if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
  applyTgTheme(tg.themeParams);
  try { tg.onEvent('themeChanged', function () { applyTgTheme(tg.themeParams); }); } catch (e) {}
}
function setupMax(w) {
  P.max = w;
  if (typeof w.initData === 'string' && w.initData) P.initData = w.initData;
  try { if (w.ready) w.ready(); } catch (e) {}
}
function initSdk() {
  var jobs = [];
  if (P.name !== 'max') {
    jobs.push(loadScript('https://telegram.org/js/telegram-web-app.js', 6000).then(function (ok) {
      var tg = ok && window.Telegram && window.Telegram.WebApp;
      if (!tg) return;
      if (!P.name && tg.initData) P.name = 'tg';
      if (P.name === 'tg') setupTg(tg);
    }));
  }
  if (P.name !== 'tg') {
    jobs.push(loadScript('https://st.max.ru/js/max-web-app.js', 6000).then(function (ok) {
      var w = ok && window.WebApp;
      if (!w) return;
      if (!P.name && typeof w.initData === 'string' && w.initData) P.name = 'max';
      if (P.name === 'max') setupMax(w);
    }));
  }
  return Promise.all(jobs);
}
var backFn = null;
function setBack(fn) {
  var bs = [P.tg && P.tg.BackButton, P.max && P.max.BackButton].filter(Boolean);
  bs.forEach(function (b) { try { if (backFn) b.offClick(backFn); } catch (e) {} });
  backFn = fn;
  bs.forEach(function (b) { try { if (fn) { b.onClick(fn); b.show(); } else b.hide(); } catch (e) {} });
}
function haptic(t) {
  try {
    var h = (P.tg && P.tg.HapticFeedback) || (P.max && P.max.HapticFeedback);
    if (!h) return;
    if (t === 'success' || t === 'error' || t === 'warning') h.notificationOccurred(t); else h.impactOccurred(t || 'light');
  } catch (e) {}
}
function platformLabel() { return P.name === 'tg' ? 'Telegram' : P.name === 'max' ? 'MAX' : ''; }

/* ---------------- сервер ---------------- */
function api(action, data) {
  if (!/^https?:\/\//.test(API_URL)) return Promise.reject(Object.assign(new Error('В index.html не указан адрес сервера (API_URL).'), { code: 'NO_API' }));
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: action, data: data || {}, platform: P.name, initData: P.initData }),
  }).then(function (r) {
    return r.text().then(function (t) {
      var j;
      try { j = JSON.parse(t); } catch (e) {
        throw Object.assign(new Error('Сервер ответил не так, как ожидалось. Проверьте, что веб-приложение Apps Script развёрнуто с доступом «Все».'), { code: 'BAD_SERVER' });
      }
      if (!j.ok) throw Object.assign(new Error(j.error || 'Ошибка'), { code: j.code || '' });
      return j.data;
    });
  }, function () {
    throw Object.assign(new Error('Нет связи с сервером. Проверьте интернет и попробуйте ещё раз.'), { code: 'NETWORK' });
  });
}

/* ---------------- состояние ---------------- */
var S = { screen: 'loading', d: null, err: null, tab: 'schedule', day: null, admTab: 'bookings', myTab: 'up', q: '', busy: 0, last: 0, showCode: false };

function setBusy(n) { S.busy = Math.max(0, S.busy + n); $('#progress').classList.toggle('on', S.busy > 0); }
var toastT;
function toast(msg, kind) {
  var t = $('#toast');
  t.textContent = msg; t.className = 'show' + (kind === 'error' ? ' error' : '');
  clearTimeout(toastT);
  toastT = setTimeout(function () { t.className = ''; }, Math.min(9000, (kind === 'error' ? 4200 : 2600) + Math.max(0, String(msg).length - 60) * 35));
}
function clampDay(iso) {
  var st = S.d.settings;
  return iso < st.minDate ? st.minDate : iso > st.maxDate ? st.maxDate : iso;
}
/* Последнее состояние хранится на устройстве: при следующем открытии показываем его сразу, свежие данные — в фоне */
function cacheKey() { var u = launchUser(); return u && u.id ? 'zal_state_v1:' + P.name + ':' + u.id : ''; }
function saveCache(d) {
  var k = cacheKey(); if (!k || !d || !d.me) return;
  try { var c = {}; for (var x in d) if (x !== 'notice') c[x] = d[x]; localStorage.setItem(k, JSON.stringify({ t: Date.now(), d: c })); } catch (e) {}
}
function readCache() {
  var k = cacheKey(); if (!k) return null;
  try { var v = JSON.parse(localStorage.getItem(k) || 'null'); return v && v.d && Date.now() - v.t < 14 * 864e5 ? v.d : null; } catch (e) { return null; }
}
function apply(d, fromCache) {
  if (!fromCache) saveCache(d);
  S.stale = !!fromCache;
  S.d = d; S.last = Date.now();
  if (!S.day) S.day = clampDay(d.settings.today);
  S.screen = !d.me ? 'register' : d.me.status === 'Отклонён' ? 'rejected' : (d.me.nameBad && !d.me.isAdmin) ? 'fixname' : d.me.status === 'Одобрен' ? 'app' : 'pending';
  if (S.tab === 'admin' && !(d.me && d.me.isAdmin)) S.tab = 'schedule';
  if (d.notice && !fromCache) toast(d.notice);
  render(true);
}
function load(first) {
  if (first && !S.d) {
    var c = readCache();
    if (c && c.settings) {
      // дата «сегодня» из кэша могла устареть — до прихода свежих данных считаем по часам телефона
      var t = new Date(), iso = t.getFullYear() + '-' + p2(t.getMonth() + 1) + '-' + p2(t.getDate());
      if (iso > c.settings.today) c.settings.today = iso;
      apply(c, true);
    }
  }
  setBusy(1);
  return api('init').then(function (d) { apply(d); }, function (e) {
    if (!S.d) { S.screen = 'error'; S.err = e; render(); } else toast(S.stale ? 'Не удалось обновить — показаны данные с прошлого входа' : e.message, 'error');
  }).then(function () { setBusy(-1); });
}
function act(action, data, onErr) {
  setBusy(1);
  return api(action, data).then(function (d) {
    haptic('success'); apply(d); return d;
  }, function (e) {
    haptic('error');
    if (!(onErr && onErr(e) === true)) toast(e.message, 'error');
    if (e.code === 'STALE') load();
    return null;
  }).then(function (r) { setBusy(-1); return r; });
}

/* ---------------- данные ---------------- */
function bookings() { return (S.d && S.d.bookings) || []; }
function byStart(a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (toMin(a.start) || 0) - (toMin(b.start) || 0); }
function dayList(iso) { return bookings().filter(function (b) { return b.date === iso && b.status !== 'cancelled'; }).sort(byStart); }
function overlaps(date, s, e, status, exceptRow) {
  return bookings().filter(function (b) {
    var bs = toMin(b.start), be = toMin(b.end);
    return b.row !== exceptRow && b.date === date && b.status === status && bs != null && be != null && bs < e && be > s;
  }).sort(byStart);
}
function freeWindows(iso) {
  var st = S.d.settings, ds = toMin(st.dayStart), de = toMin(st.dayEnd);
  var from = ds;
  if (iso === st.today) from = Math.max(ds, Math.ceil((toMin(st.now) + 1) / 5) * 5);
  var busy = dayList(iso).map(function (b) { return [toMin(b.start), toMin(b.end)]; }).filter(function (x) { return x[0] != null && x[1] != null; })
    .sort(function (a, b) { return a[0] - b[0]; });
  var out = [], cur = from;
  busy.forEach(function (x) { if (x[0] > cur) out.push([cur, x[0]]); cur = Math.max(cur, x[1]); });
  if (de > cur) out.push([cur, de]);
  return out.filter(function (w) { return w[1] - w[0] >= 15; });
}
function mayBook() { return !!(S.d && S.d.me && S.d.me.canBook !== false); }
var LEVELS = { admin: 'Администратор', book: 'Просмотр и бронирование', view: 'Только просмотр', clean: 'Клининг' };
function canBook(iso) { var st = S.d.settings; return mayBook() && iso >= st.today && iso >= st.minDate && iso <= st.maxDate; }
function pendingBookings() { var t = S.d.settings.today; return bookings().filter(function (b) { return b.status === 'pending' && b.date >= t; }).sort(byStart); }
function pendingUsers() { return ((S.d.admin && S.d.admin.users) || []).filter(function (u) { return u.status === 'Заявка'; }); }
function findBooking(row) { return bookings().filter(function (b) { return b.row === +row; })[0]; }
function findUser(uid) { return ((S.d.admin && S.d.admin.users) || []).filter(function (u) { return u.uid === uid; })[0]; }

/* ---------------- отрисовка ---------------- */
function render(keepScroll) {
  var y = window.scrollY, h = '';
  if (S.screen === 'loading') h = '<div class="center"><div class="spinner"></div><div>Загружаем расписание…</div></div>';
  else if (S.screen === 'noplatform') h = vNoPlatform();
  else if (S.screen === 'error') h = vError();
  else if (S.screen === 'register') h = vRegister();
  else if (S.screen === 'pending') h = vPending();
  else if (S.screen === 'fixname') h = vFixName();
  else if (S.screen === 'rejected') h = vRejected();
  else h = vApp();
  $('#app').innerHTML = h;
  document.body.classList.toggle('with-tabs', S.screen === 'app');
  document.body.classList.toggle('with-fab', S.screen === 'app' && S.tab === 'schedule' && canBook(S.day));
  if (keepScroll) window.scrollTo(0, y);
  festOnce();
}

function hero(icon, cls, title, text) {
  return '<div class="hero"><div class="ico ' + (cls || '') + '">' + icon + '</div><h1>' + title + '</h1>' + (text ? '<p>' + text + '</p>' : '') + '</div>';
}

function vNoPlatform() {
  return '<div class="wrap">' + hero(I.logo, '', 'Актовый зал', 'Расписание и бронирование') +
    '<div class="card"><b>Откройте приложение через бота</b><p class="hint small" style="margin:6px 0 0">Эта страница работает внутри Telegram или MAX. Найдите бота актового зала и нажмите кнопку «Открыть».</p></div></div>';
}

function vError() {
  var e = S.err || {}, extra = '';
  if (e.code === 'EXPIRED' || e.code === 'BAD_AUTH') extra = '<p class="hint small mt">Закройте приложение и откройте его снова из чата с ботом.</p>';
  if (e.code === 'NOT_CONFIGURED' || e.code === 'SETUP' || e.code === 'NO_API' || e.code === 'BAD_SERVER') extra = '<p class="hint small mt">Сообщите администратору — это настройка сервера.</p>';
  return '<div class="wrap">' + hero(I.alert, 'bad', 'Не получилось открыть', esc(e.message || 'Неизвестная ошибка')) + extra +
    '<div class="mt2"><button class="btn" data-a="retry">Повторить</button></div>' +
    (P.tg ? '<button class="linkish" data-a="close">Закрыть</button>' : '') + '</div>';
}

function launchUser() {
  var out = {};

/* ---------------- шторки ---------------- */
var stack = [];
function openSheet(html, onMount) {
  var root = $('#sheets');
  var bd = document.createElement('div'); bd.className = 'backdrop';
  var sh = document.createElement('div'); sh.className = 'sheet'; sh.setAttribute('role', 'dialog');
  sh.innerHTML = '<div class="inner"><div class="grab"></div>' + html + '</div>';
  root.appendChild(bd); root.appendChild(sh);
  var item = { bd: bd, sh: sh };
  stack.push(item);
  bd.addEventListener('click', closeSheet);
  requestAnimationFrame(function () { bd.classList.add('show'); sh.classList.add('show'); });
  setBack(closeSheet);
  if (onMount) onMount(sh);
  return sh;
}
function closeSheet() {
  var it = stack.pop(); if (!it) return;
  it.bd.classList.remove('show'); it.sh.classList.remove('show');
  setTimeout(function () { it.bd.remove(); it.sh.remove(); }, 300);
  setBack(stack.length ? closeSheet : null);
}
function closeAll() { while (stack.length) closeSheet(); }

function ask(o) {
  return new Promise(function (resolve) {
    var root = $('#sheets'), done = false;
    var bd = document.createElement('div'); bd.className = 'backdrop'; bd.style.zIndex = 30;
    var wrap = document.createElement('div'); wrap.className = 'dialog-wrap';
    wrap.innerHTML = '<div class="dialog" role="alertdialog"><h3>' + esc(o.title) + '</h3>' + (o.text ? '<p class="lead">' + o.text + '</p>' : '') +
      (o.reason ? '<div class="field"><textarea class="input" id="ask-r" rows="2" placeholder="' + esc(o.reason) + '">' + esc(o.reasonValue || '') + '</textarea></div>' : '') +
      (o.check ? '<label class="check"><input type="checkbox" id="ask-c"' + (o.check.on ? ' checked' : '') + '><span>' + o.check.label + '</span></label>' : '') +
      '<div class="sheet-actions"><button class="btn' + (o.danger ? ' danger' : '') + '" id="ask-ok">' + esc(o.ok || 'Да') + '</button>' +
      '<button class="btn ghost" id="ask-no">Отмена</button></div></div>';
    root.appendChild(bd); root.appendChild(wrap);
    var dlg = wrap.firstChild;
    requestAnimationFrame(function () { bd.classList.add('show'); dlg.classList.add('show'); });
    var fin = function (v) {
      if (done) return; done = true;
      bd.classList.remove('show'); dlg.classList.remove('show');
      setTimeout(function () { bd.remove(); wrap.remove(); }, 220);
      setBack(stack.length ? closeSheet : null);
      resolve(v);
    };
    bd.onclick = function () { fin(null); };
    $('#ask-no', dlg).onclick = function () { fin(null); };
    $('#ask-ok', dlg).onclick = function () {
      fin({ reason: o.reason ? $('#ask-r', dlg).value.trim() : '', checked: o.check ? $('#ask-c', dlg).checked : false });
    };
    setBack(function () { fin(null); });
  });
}

  var h = '<div class="cal-head"><div class="t">' + MN[m - 1] + ' ' + y + '</div>' +

  for (var i = 0; i < lead; i++) h += '<span class="cal-d blank"></span>';

        if (e.code === 'CONFLICT') { q('f-status').innerHTML = '<div class="status-line bad">' + esc(e.message) + '</div>'; return true; }
      }).then(function (d) {
        if (d) { S.day = first; S.tab = 'schedule'; closeAll(); render(); window.scrollTo(0, 0); }
        else q('f-go').disabled = false;
      });
    });
    paintWd();
    renderParts();
    check();
  });
}

  },
  clok: function (el) {
    var b = findBooking(el.dataset.v); if (!b) return;
    var c = b.cleaning.req, busy = clBusy(c.date, toMin(c.start), toMin(c.end), b.row);
    if (busy.length) { toast('Желаемое время пересекается: ' + busy.join(', ') + '. Назначьте другое', 'error'); openCleanForm(b.row); return; }
    act('setCleaning', { row: b.row, csig: b.csig, accept: true }).then(function (d) { if (d) closeAll(); });
  },
  clset: function (el) { closeAll(); openCleanForm(el.dataset.v); },
  clreq: function (el) { closeAll(); openCleanRequest(el.dataset.v); },
  remind: function (el) {
    var b = findBooking(el.dataset.v); if (!b) return;
    act('remindTeam', { row: b.row, sig: b.sig }).then(function (d) { if (d) closeAll(); });
  },
  urename: function (el) {
    var u = findUser(el.dataset.v); if (!u) return;
    ask({ title: 'Изменить ФИО', text: 'Сейчас: ' + esc(u.fio) + '. Фамилия и имя русскими буквами, отчество — по желанию.', reason: 'Фамилия Имя Отчество', reasonValue: u.nameBad ? '' : u.fio, ok: 'Сохранить' })
      .then(function (r) {
        if (!r) return;
        var v = niceFio(r.reason || ''), pr = fioProblem(v);
        if (pr) { toast(pr, 'error'); return; }
        act('setUserName', { uid: u.uid, fio: v }).then(function (d) { if (d) closeAll(); });
      });
  },
  uspec: function (el) {
    var specs = [].map.call(document.querySelectorAll('#u-spec button.on'), function (b) { return b.dataset.v; });
    act('setSpecialty', { uid: el.dataset.v, specs: specs }).then(function (d) { if (d) closeAll(); });
  },
  ulevel: function (el) {
    var u = findUser(el.dataset.v), l = el.dataset.l; if (!u) return;
    if (u.status === 'Одобрен' && (u.level || 'book') === l) return;
    var go = function () { act('setRole', { uid: u.uid, level: l }).then(function (d) { if (d) closeAll(); }); };
    if (l === 'admin' || u.level === 'admin') {
      ask({ title: l === 'admin' ? 'Сделать администратором?' : 'Снять права администратора?', text: l === 'admin' ? esc(u.fio) + ' сможет подтверждать брони и управлять пользователями.' : esc(u.fio) + ': ' + LEVELS[l].toLowerCase() + '.', ok: l === 'admin' ? 'Сделать администратором' : 'Изменить права' })
        .then(function (r) { if (r) go(); });
    } else go();
  },
  festx: function () {
    var t = S.d.settings.today; S.festOff = t;
    try { localStorage.setItem('fest:' + t, '1'); } catch (e) {}
    render(true);
  },
  egg: function () {
    clearTimeout(S.eggT); S.egg = (S.egg || 0) + 1;
    S.eggT = setTimeout(function () { S.egg = 0; }, 1500);
    if (S.egg >= 5) {
      S.egg = 0; var f = festive(S.d.settings.today);
      burst(f.fx || 'confetti', 30); haptic('success');
      toast(f.holiday ? f.e + ' ' + f.text : '🎭 Занавес! Вы нашли пасхалку актового зала');
    }
  },
  ublock: function (el) {
    var u = findUser(el.dataset.v); if (!u) return;
    ask({ title: 'Закрыть доступ?', text: esc(u.fio) + ' больше не сможет открыть приложение. Брони останутся в таблице. Вернуть доступ можно здесь же, выбрав права.', ok: 'Закрыть доступ', danger: true })
      .then(function (r) { if (r) act('rejectUser', { uid: u.uid }).then(function (d) { if (d) closeAll(); }); });
  },
  ureject: function (el) {
    var u = findUser(el.dataset.v); if (!u) return;
    ask({ title: 'Отклонить заявку?', text: esc(u.fio) + ' не получит доступ к расписанию.', ok: 'Отклонить', danger: true })
      .then(function (r) { if (r) act('rejectUser', { uid: u.uid }); });
  },
  urole: function (el) {
    var on = el.dataset.on === '1', u = findUser(el.dataset.v); if (!u) return;
    ask({ title: on ? 'Сделать администратором?' : 'Снять права администратора?', text: on ? esc(u.fio) + ' сможет подтверждать брони и управлять пользователями.' : '', ok: on ? 'Сделать администратором' : 'Снять права' })
      .then(function (r) { if (r) act('setRole', { uid: u.uid, admin: on }).then(function (d) { if (d) closeAll(); }); });
  },
  udelete: function (el) {
    var u = findUser(el.dataset.v); if (!u) return;
    var hasG = !!u.email && /выдан/i.test(u.gaccess || '') && !/не выдан/i.test(u.gaccess || '');
    ask({ title: 'Удалить пользователя?', text: esc(u.fio) + ' будет удалён(а) из таблицы «Доступы» и потеряет доступ к приложению. Его брони останутся в расписании.',
      check: u.email ? { label: 'Также закрыть доступ к Google-таблице для ' + esc(u.email), on: hasG } : null, ok: 'Удалить', danger: true })
      .then(function (r) { if (r) act('deleteUser', { uid: u.uid, revoke: r.checked }).then(function (d) { if (d) closeAll(); }); });
  },
  linkcode: function () {
    act('linkCode').then(function (d) {
      if (!d || !d.linkCode) return;
      var box = $('#p-link'); if (!box) return;
      var other = P.name === 'tg' ? 'MAX' : 'Telegram';
      box.innerHTML = '<div style="font-weight:600;text-align:center">Код для ' + other + '</div><div class="code">' + esc(d.linkCode.code) + '</div>' +
        '<p class="hint small" style="text-align:center;margin:0">Откройте бота в ' + other + ' → «Уже есть доступ в другом мессенджере?» → введите код. Действует ' + d.linkCode.minutes + ' минут.</p>';
    });
  },
};

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-a]');
  if (!el || !A[el.dataset.a]) return;
  ev.preventDefault();
  A[el.dataset.a](el);
});
document.addEventListener('focusout', function (ev) {
  if (ev.target.id === 'r-fio' || ev.target.id === 'fx-fio') {
    var v = ev.target.value; if (v.trim()) ev.target.value = niceFio(v);
    if (ev.target.id === 'r-fio') { S.regFio = ev.target.value; checkTwin(); }
  }
});
/* листание дней пальцем */
(function () {
  var sx = 0, sy = 0, t0 = 0, on = false;
  document.addEventListener('touchstart', function (ev) {
    on = false;
    if (S.screen !== 'app' || S.tab !== 'schedule' || ev.touches.length !== 1) return;
    if (document.querySelector('.sheet, .dialog-wrap') || ev.target.closest('input,textarea,select,.side,nav.tabs')) return;
    sx = ev.touches[0].clientX; sy = ev.touches[0].clientY; t0 = Date.now(); on = true;
  }, { passive: true });
  document.addEventListener('touchend', function (ev) {
    if (!on) return; on = false;
    var t = ev.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx) * 0.6 || Date.now() - t0 > 700) return;
    var next = clampDay(addDays(S.day, dx < 0 ? 1 : -1));
    if (next === S.day) return;
    S.day = next; haptic(); render();
    var m = $('main'); if (m) { m.classList.add(dx < 0 ? 'swipe-l' : 'swipe-r'); }
  }, { passive: true });
})();
document.addEventListener('input', function (ev) {
  if (ev.target.id === 'r-fio') { S.regFio = ev.target.value; clearTimeout(S.twinT); S.twinT = setTimeout(checkTwin, 900); }
  if (ev.target.id === 'q') {
    S.q = ev.target.value;
    var pos = ev.target.selectionStart;
    render(true);
    var q = $('#q'); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) {} }
  }
});
document.addEventListener('submit', function (ev) {
  if (ev.target.id === 'reg') {
    ev.preventDefault();
    var fio = $('#r-fio').value.trim(), pos = $('#r-pos').value.trim(), mail = $('#r-mail').value.trim();
    var fp = fioProblem(fio);
    if (fp) { toast(fp, 'error'); $('#r-fio').focus(); return; }
    fio = niceFio(fio); $('#r-fio').value = fio;
    if (!pos) { toast('Укажите должность', 'error'); $('#r-pos').focus(); return; }
    var go = $('#r-go'); if (go) go.disabled = true;
    act('register', { fio: fio, position: pos, email: mail, force: !!S.forceReg }, function (e) {
      if (e.code === 'NAME_TWIN') { S.twin = { via: /Telegram/.test(e.message) ? 'Telegram' : 'MAX' }; var box = $('#r-twin'); if (box) { box.innerHTML = twinBox(); box.scrollIntoView({ block: 'center' }); } return true; }
    }).then(function (d) {
      if (!d) { var g = $('#r-go'); if (g) g.disabled = false; return; }
      if (d && d.me && d.me.status !== 'Одобрен' && P.tg && P.tg.requestWriteAccess && P.tg.initDataUnsafe && P.tg.initDataUnsafe.user && P.tg.initDataUnsafe.user.allows_write_to_pm === false) {
        try { P.tg.requestWriteAccess(); } catch (e) {}
      }
    });
  }
  if (ev.target.id === 'fixf') {
    ev.preventDefault();
    var nf = $('#fx-fio').value, pr = fioProblem(nf);
    if (pr) { $('#fx-err').textContent = pr; $('#fx-fio').focus(); return; }
    $('#fx-fio').value = niceFio(nf);
    act('setMyName', { fio: niceFio(nf) }, function (e) { $('#fx-err').textContent = e.message; return true; });
  }
  if (ev.target.id === 'linkf') {
    ev.preventDefault();
    var code = $('#l-code').value.replace(/\D/g, '');
    if (code.length !== 6) { toast('Код — 6 цифр', 'error'); return; }
    var lb = ev.target.querySelector('button'); lb.disabled = true;
    act('link', { code: code }).then(function () { var b = document.querySelector('#linkf button'); if (b) b.disabled = false; });
  }
});
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && S.d && !stack.length && Date.now() - S.last > 60000) load();
});

/* ---------------- запуск ---------------- */
(function boot() {
  var hp = parseHash();
  if (hp.tgWebAppData) {
    P.name = 'tg'; P.initData = hp.tgWebAppData;
    try { applyTgTheme(JSON.parse(hp.tgWebAppThemeParams || 'null')); } catch (e) {}
  } else if (hp.WebAppData) {
    P.name = 'max'; P.initData = hp.WebAppData;
  } else {
    try { var s = JSON.parse(sessionStorage.getItem('zal_launch') || 'null'); if (s && s.name) { P.name = s.name; P.initData = s.initData; } } catch (e) {}
  }
  if (!document.documentElement.classList.contains('tg') && window.matchMedia) {
    var mq = matchMedia('(prefers-color-scheme: dark)');
    document.documentElement.classList.toggle('dark', mq.matches);
    try { mq.addEventListener('change', function (e) { if (!document.documentElement.classList.contains('tg')) document.documentElement.classList.toggle('dark', e.matches); }); } catch (e) {}
  }
  render();
  var sdk = initSdk();
  var start = function () {
    if (!P.name || !P.initData) { S.screen = 'noplatform'; render(); return; }
    try { sessionStorage.setItem('zal_launch', JSON.stringify({ name: P.name, initData: P.initData })); } catch (e) {}
    load(true);
  };
  if (P.name) start(); else sdk.then(start);
})();
})();
</script>
